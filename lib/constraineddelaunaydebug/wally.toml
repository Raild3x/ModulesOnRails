[package]
name = "raild3x/constraineddelaunaydebug"
description = "Debug backends (SVG, Roblox) for ConstrainedDelaunay and NavMesh DrawLists."
authors = ["Logan Hunt (Raildex)"]
version = "0.1.0"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[custom]
# Marks the package as beta in the generated README (existing convention)
unreleased = true
# Blocks semver-labelled PRs touching this package (validate_publish_setup.py --check publishable)
publishable = "false"
# The properly capitalized and spaced name of the library
formattedName = "ConstrainedDelaunayDebug"
# Unpublished in-repo dependencies, vendored by setup (see scripts/setup_package_for_testing.py)
siblings = "constraineddelaunay"
# The intro page for the documentation
docsLink = "ConstrainedDelaunayDebug"

[dependencies]
